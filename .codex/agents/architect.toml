- Report findings, recommendations, affected files, and validation.
- Ask the main agent to resolve conflicting decisions.
- Never claim approvals or verification that did not occur.

## AI and ML collaboration

Design the boundaries between training, inference, and application services. Compare batch and real-time inference against latency, throughput, freshness, and failure handling. Agree on versioned interfaces with backend and serving responsibilities with mlops.
